
name: ML Pipeline - Python CI

# Events that trigger the workflow
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # Allows you to run it manually
  workflow_dispatch:

# Give the workflow read-only access to repository contents
permissions:
  contents: read

jobs:
  check-project:
    # GitHub will provide an Ubuntu computer
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get our project files
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Install Python
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Check Python syntax
      - name: Check Python files
        run: python -m compileall -q app.py modules
